name: Validate Android
on:
  push:
    branches: [main, Dev]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Validate Firebase credentials without sending a notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Skipping Firebase validation (credentials not configured in repository secrets)"
            exit 0
          fi
          export UPDATE_VERSION="$(node -p "require('./frontend/package.json').version")"
          node frontend/scripts/notify-release.mjs --validate
      - name: Configure Firebase
        env:
          CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$CONFIG" ]; then
            echo "Skipping Firebase configuration (GOOGLE_SERVICES_JSON_BASE64 not configured in repository secrets)"
            exit 0
          fi
          printf '%s' "$CONFIG" | base64 --decode > frontend/android/app/google-services.json
      - run: pnpm run build:mobile
        working-directory: frontend
      - run: ./gradlew assembleDebug :app:lintDebug
        working-directory: frontend/android
      - name: Determine if Android emulator test should run
        id: check-native
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_emulator=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^frontend/android/'; then
              echo "run_emulator=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_emulator=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run_emulator=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test background workout notification on Android emulator
        if: steps.check-native.outputs.run_emulator == 'true'
        shell: bash
        run: |
          set -eo pipefail
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tgym-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/tgym-emulator.log 2>/dev/null || true; adb logcat -d -s TGymWorkoutNotification:E AndroidRuntime:E || true' EXIT
          echo "y" | sdkmanager --install 'system-images;android-35;google_apis;x86_64' 'emulator' >/dev/null || {
            echo "Retrying SDK download once..."
            sleep 3
            echo "y" | sdkmanager --install 'system-images;android-35;google_apis;x86_64' 'emulator' >/dev/null
          }
          echo no | avdmanager create avd --force --name tgym-test --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd tgym-test -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/tgym-emulator.log 2>&1 &
          timeout --kill-after=10s 120 adb wait-for-device
          timeout --kill-after=10s 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          cd frontend/android
          ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always() && steps.check-native.outputs.run_emulator == 'true'
        with:
          name: android-notification-test-report
          path: frontend/android/app/build/reports/androidTests/
